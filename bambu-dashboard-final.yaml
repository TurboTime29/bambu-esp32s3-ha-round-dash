text_sensor:
  - platform: homeassistant
    id: print_status
    entity_id: sensor.p2s_22e8aj592301504_print_status
    on_value:
      then:
        - lambda: |-
            std::string status_l = x;
            std::transform(status_l.begin(), status_l.end(), status_l.begin(), ::tolower);
            ESP_LOGD("print_status", "Status: %s", status_l.c_str());
        # Auto-switch to progress page when printing starts
        - if:
            condition:
              lambda: |-
                std::string status_l = x;
                std::transform(status_l.begin(), status_l.end(), status_l.begin(), ::tolower);
                return (status_l == "running" || status_l == "prepare");
            then:
              - lvgl.page.show: page_progress
            
  - platform: homeassistant
    id: current_stage
    entity_id: sensor.p2s_22e8aj592301504_current_stage
    on_value:
      then:
        - lvgl.label.update:
            id: stage_label
            text: !lambda |-
              std::string stage = x;
              
              // If stage is empty/Idle and print is at 100%, show bed temp instead
              if (stage.empty() || stage == "idle" || stage == "Idle") {
                if (id(print_progress).has_state() && id(print_progress).state >= 100) {
                  if (id(bed_temp).has_state()) {
                    static char buf[20];
                    snprintf(buf, sizeof(buf), "Bed: %.0f°", id(bed_temp).state);
                    return buf;
                  }
                }
                return "Idle";
              }
              
              // Convert to title case
              bool capitalize_next = true;
              for (size_t i = 0; i < stage.length(); i++) {
                if (capitalize_next && isalpha(stage[i])) {
                  stage[i] = toupper(stage[i]);
                  capitalize_next = false;
                } else if (stage[i] == ' ' || stage[i] == '_') {
                  capitalize_next = true;
                  if (stage[i] == '_') stage[i] = ' ';  // Replace underscores with spaces
                } else {
                  stage[i] = tolower(stage[i]);
                }
              }
              return stage.c_str();
            
  # AMS Tray filament types
  - platform: homeassistant
    id: ams_tray_1
    entity_id: sensor.p2s_22e8aj592301504_ams_1_tray_1
