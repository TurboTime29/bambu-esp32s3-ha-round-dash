esphome:
  name: bambu-dashboard
  friendly_name: Bambu Lab Dashboard
  platformio_options:
    board_build.flash_mode: dio

# ROTATION DISABLED - Uncomment to re-enable
# external_components:
#   - source: github://dala318/esphome-qmi8658
#     components: [qmi8658]

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  variant: esp32s3

logger:
  level: INFO
  baud_rate: 0  # Disable UART logging for better performance

api:
  reboot_timeout: 0s  # Don't reboot on API disconnect

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true  # Skip WiFi scan, connect faster
  power_save_mode: none  # Better performance
  reboot_timeout: 10min  # Don't reboot too quickly on disconnect

time:
  - platform: homeassistant
    id: ha_time
    timezone: America/New_York
    on_time_sync:
      then:
        - lvgl.label.update:
            id: temps_time_label
            text: !lambda |-
              static char time_str[12];
              auto time = id(ha_time).now();
              int hour = time.hour;
              const char* period = "AM";
              if (hour >= 12) {
                period = "PM";
                if (hour > 12) hour -= 12;
              }
              if (hour == 0) hour = 12;
              snprintf(time_str, sizeof(time_str), "%d:%02d %s", hour, time.minute, period);
              return time_str;
    on_time:
      - seconds: 0
        then:
          - lvgl.label.update:
              id: temps_time_label
              text: !lambda |-
                static char time_str[12];
                auto time = id(ha_time).now();
                int hour = time.hour;
                const char* period = "AM";
                if (hour >= 12) {
                  period = "PM";
                  if (hour > 12) hour -= 12;
                }
                if (hour == 0) hour = 12;
                snprintf(time_str, sizeof(time_str), "%d:%02d %s", hour, time.minute, period);
                return time_str;

psram:
  mode: quad
  speed: 80MHz

spi:
  - id: spi_bus
    clk_pin: GPIO10
    mosi_pin: GPIO11
    miso_pin: GPIO12

i2c:
  id: i2c_bus
  sda: GPIO6
  scl: GPIO7
  scan: true

touchscreen:
  - platform: cst816
    id: touch_screen
    interrupt_pin: GPIO5
    reset_pin: GPIO13
    i2c_id: i2c_bus

display:
  - platform: ili9xxx
    model: gc9a01a
    id: round_display
    spi_id: spi_bus
    cs_pin: GPIO9
    dc_pin: GPIO8
    reset_pin: GPIO14
    rotation: 0
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never

output:
  - platform: ledc
    pin: GPIO2
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: display_backlight
    restore_mode: RESTORE_DEFAULT_ON

# Brightness control
number:
  - platform: template
    name: "Display Brightness"
    id: brightness_control
    min_value: 10
    max_value: 100
    step: 10
    initial_value: 40
    optimistic: true
    on_value:
      then:
        - light.turn_on:
            id: display_backlight
            brightness: !lambda return x / 100.0;
        - lvgl.label.update:
            id: brightness_label
            text: !lambda |-
              static char buf[10];
              snprintf(buf, sizeof(buf), "%d%%", (int)x);
              return buf;

sensor:
  - platform: homeassistant
    id: print_progress
    entity_id: sensor.p2s_22e8aj592301504_print_progress
    filters:
      - throttle: 2s  # Only update every 2 seconds max
    on_value:
      then:
        # Update arc value
        - lvgl.arc.update:
            id: progress_arc
            value: !lambda return x;
        # Update arc indicator color based on progress and bed temp
        - lambda: |-
            uint32_t color;
            if (x >= 100) {
              // 100% complete - check bed temp
              if (id(bed_temp).has_state() && id(bed_temp).state < 46) {
                color = 0x4A90E2;  // Blue - cooled
              } else {
                color = 0x00bb2c;  // Green - still hot
              }
            } else {
              color = 0xFFFFFF;  // White - printing
            }
            auto arc = id(progress_arc);
            lv_obj_set_style_arc_color(arc, lv_color_hex(color), LV_PART_INDICATOR);
        - lvgl.label.update:
            id: progress_label
            text: !lambda |-
              static char buf[10];
              snprintf(buf, sizeof(buf), "%.0f%%", x);
              return buf;
            
  - platform: homeassistant
    id: chamber_temp
    entity_id: sensor.p2s_22e8aj592301504_chamber_temperature
    filters:
      - throttle: 3s  # Temp doesn't change fast
    on_value:
      then:
        - lvgl.label.update:
            id: chamber_label
            text: !lambda |-
              static char buf[10];
              snprintf(buf, sizeof(buf), "%.0f°", x);
              return buf;
              
  - platform: homeassistant
    id: nozzle_temp
    entity_id: sensor.p2s_22e8aj592301504_nozzle_temperature
    filters:
      - throttle: 3s  # Temp doesn't change fast
    on_value:
      then:
        - lvgl.label.update:
            id: nozzle_label
            text: !lambda |-
              static char buf[10];
              snprintf(buf, sizeof(buf), "%.0f°", x);
              return buf;
              
  - platform: homeassistant
    id: bed_temp
    entity_id: sensor.p2s_22e8aj592301504_bed_temperature
    filters:
      - throttle: 3s  # Temp doesn't change fast
    on_value:
      then:
        - lvgl.label.update:
            id: bed_label
            text: !lambda |-
              static char buf[10];
              snprintf(buf, sizeof(buf), "%.0f°", x);
              return buf;
        # If at 100%, update arc color and stage label based on bed temp
        - if:
            condition:
              lambda: return id(print_progress).has_state() && id(print_progress).state >= 100;
            then:
              - lambda: |-
                  uint32_t color = (x < 46) ? 0x4A90E2 : 0x00bb2c;  // Blue if cool, green if hot
                  auto arc = id(progress_arc);
                  lv_obj_set_style_arc_color(arc, lv_color_hex(color), LV_PART_INDICATOR);
              - lvgl.label.update:
                  id: stage_label
                  text: !lambda |-
                    static char buf[20];
                    snprintf(buf, sizeof(buf), "Bed: %.0f°", x);
                    return buf;
            
  - platform: homeassistant
    id: current_layer
    entity_id: sensor.p2s_22e8aj592301504_current_layer
    filters:
      - throttle: 2s  # Layers change frequently during print
    on_value:
      then:
        - lvgl.label.update:
            id: layer_label
            text: !lambda |-
              static char buf[20];
              snprintf(buf, sizeof(buf), "%d/%d", (int)x, (int)id(total_layers).state);
              return buf;
    
  - platform: homeassistant
    id: total_layers
    entity_id: sensor.p2s_22e8aj592301504_total_layer_count
    filters:
      - throttle: 5s  # Total layers rarely changes
    on_value:
      then:
        - lvgl.label.update:
            id: layer_label
            text: !lambda |-
              static char buf[20];
              snprintf(buf, sizeof(buf), "%d/%d", (int)id(current_layer).state, (int)x);
              return buf;
              
  - platform: homeassistant
    id: remaining_time
    entity_id: sensor.p2s_22e8aj592301504_remaining_time
    filters:
      - throttle: 5s  # Time estimate doesn't need frequent updates
    on_value:
      then:
        - logger.log:
            format: "Remaining time (hours): %.4f"
            args: ['x']
        - lvgl.label.update:
            id: time_label
            text: !lambda |-
              // Sensor sends hours as decimal, convert to minutes
              if (isnan(x) || x <= 0) {
                ESP_LOGD("remaining_time", "No time or invalid");
                return "--";
              }
              
              int total_minutes = (int)(x * 60);  // Convert hours to minutes
              ESP_LOGD("remaining_time", "Hours: %.4f, Minutes: %d", x, total_minutes);
              
              static char buf[30];
              if (total_minutes > 60) {
                int hours = total_minutes / 60;
                int mins = total_minutes % 60;
                snprintf(buf, sizeof(buf), "%dh %dm left", hours, mins);
              } else {
                snprintf(buf, sizeof(buf), "%dm left", total_minutes);
              }
              ESP_LOGD("remaining_time", "Displaying: %s", buf);
              return buf;
              
  - platform: homeassistant
    id: ams_humidity
    entity_id: sensor.p2s_22e8aj592301504_ams_1_humidity
    filters:
      - throttle: 10s  # Humidity changes very slowly
    on_value:
      then:
        - lvgl.label.update:
            id: ams_humidity_label
            text: !lambda |-
              static char buf[10];
              snprintf(buf, sizeof(buf), "%.0f%%", x);
              return buf;
              
  - platform: homeassistant
    id: ams_temp
    entity_id: sensor.p2s_22e8aj592301504_ams_1_temperature
    filters:
      - throttle: 10s  # AMS temp changes very slowly
    on_value:
      then:
        - lvgl.label.update:
            id: ams_temp_label
            text: !lambda |-
              static char buf[10];
              snprintf(buf, sizeof(buf), "%.0f°", x);
              return buf;

