              snprintf(buf, sizeof(buf), "%.0f°", x);
              return buf;

text_sensor:
  - platform: homeassistant
    id: print_status
    entity_id: sensor.YOUR_PRINTER_ENTITY_print_status
    on_value:
      then:
        - lambda: |-
            std::string status_l = x;
            std::transform(status_l.begin(), status_l.end(), status_l.begin(), ::tolower);
            ESP_LOGD("print_status", "Status: %s", status_l.c_str());
        # Auto-switch to progress page when printing starts
        - if:
            condition:
              lambda: |-
                std::string status_l = x;
                std::transform(status_l.begin(), status_l.end(), status_l.begin(), ::tolower);
                return (status_l == "running" || status_l == "prepare");
            then:
              - lvgl.page.show: page_progress
            
  - platform: homeassistant
    id: current_stage
    entity_id: sensor.YOUR_PRINTER_ENTITY_current_stage
    on_value:
      then:
        - lvgl.label.update:
            id: stage_label
            text: !lambda |-
              std::string stage = x;
              if (stage.empty()) return "Idle";
              
              // Convert to title case
              bool capitalize_next = true;
              for (size_t i = 0; i < stage.length(); i++) {
                if (capitalize_next && isalpha(stage[i])) {
                  stage[i] = toupper(stage[i]);
                  capitalize_next = false;
                } else if (stage[i] == ' ' || stage[i] == '_') {
                  capitalize_next = true;
                  if (stage[i] == '_') stage[i] = ' ';  // Replace underscores with spaces
                } else {
                  stage[i] = tolower(stage[i]);
                }
              }
              return stage.c_str();
            
