    hex: '000000'
  - id: color_primary
    hex: '4A90E2'
  - id: color_text_primary
    hex: 'FFFFFF'
  - id: color_text_secondary
    hex: 'A0A0A0'
  - id: color_arc_bg
    hex: '1A1A1A'

font:
  - file: "gfonts://Roboto@700"
    id: font_large
    size: 48
  - file: "gfonts://Roboto@500"
    id: font_title
    size: 22
  - file: "gfonts://Roboto@500"
    id: font_medium
    size: 18
  - file: "gfonts://Roboto@300"
    id: font_small
    size: 14
  - file: https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf
    id: icons_40
    size: 40
    glyphs: [
      "\U000F1487",  # mdi-printer-3d (chamber)
      "\U000F0E5B",  # mdi-printer-3d-nozzle-outline (hotend)
      "\U000F08A4",  # mdi-bed-queen-outline (bed)
    ]

lvgl:
  id: lvgl_id
  log_level: INFO
  color_depth: 16
  bg_color: 0
  touchscreens:
    - touchscreen_id: touch_screen
  displays:
    - round_display
  page_wrap: true
  pages:
    - id: page_temps
      widgets:
        - obj:
            x: 2
            width: 238
            height: 240
            bg_color: 0
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            widgets:
              # Left swipe zone - previous page
              - obj:
                  x: 0
                  y: 0
                  width: 120
                  height: 240
                  bg_opa: TRANSP
                  border_width: 0
                  clickable: true
                  on_press:
                    - lvgl.page.previous:
              # Right swipe zone - next page
              - obj:
                  x: 120
                  y: 0
                  width: 120
                  height: 240
                  bg_opa: TRANSP
                  border_width: 0
                  clickable: true
                  on_press:
                    - lvgl.page.next:
              
              # BED CARD - Blue
              - obj:
                  align: CENTER
                  x: -70
                  y: 0
                  width: 60
                  height: 120
                  bg_color: 0x2196F3
                  bg_opa: COVER
                  border_width: 0
                  radius: 8
                  scrollbar_mode: "OFF"
                  widgets:
                    # Bed icon
                    - label:
                        align: CENTER
                        y: -35
                        text: "\U000F08A4"
                        text_font: icons_40
                        text_color: 0xFFFFFF
                    - label:
                        align: CENTER
                        y: 10
                        text: "Bed"
                        text_font: font_small
                        text_color: 0xFFFFFF
                    - label:
                        id: bed_label
                        align: CENTER
                        y: 40
                        text_font: font_title
                        text_color: 0xFFFFFF
