esphome:
  name: bambu-dashboard
  friendly_name: Bambu Lab Dashboard

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  variant: esp32s3

logger:
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: homeassistant
    id: ha_time
    timezone: America/New_York
    on_time_sync:
      then:
        - lvgl.label.update:
            id: temps_time_label
            text: !lambda |-
              static char time_str[12];
              auto time = id(ha_time).now();
              int hour = time.hour;
              const char* period = "AM";
              if (hour >= 12) {
                period = "PM";
                if (hour > 12) hour -= 12;
              }
              if (hour == 0) hour = 12;
              snprintf(time_str, sizeof(time_str), "%d:%02d %s", hour, time.minute, period);
              return time_str;
    on_time:
      - seconds: 0
        then:
          - lvgl.label.update:
              id: temps_time_label
              text: !lambda |-
                static char time_str[12];
                auto time = id(ha_time).now();
                int hour = time.hour;
                const char* period = "AM";
                if (hour >= 12) {
                  period = "PM";
                  if (hour > 12) hour -= 12;
                }
                if (hour == 0) hour = 12;
                snprintf(time_str, sizeof(time_str), "%d:%02d %s", hour, time.minute, period);
                return time_str;

psram:
  mode: quad
  speed: 80MHz

spi:
  - id: spi_bus
    clk_pin: GPIO10
    mosi_pin: GPIO11
    miso_pin: GPIO12

i2c:
  id: i2c_bus
  sda: GPIO6
  scl: GPIO7
  scan: true

touchscreen:
  - platform: cst816
    id: touch_screen
    interrupt_pin: GPIO5
    reset_pin: GPIO13
    i2c_id: i2c_bus

display:
  - platform: ili9xxx
    model: gc9a01a
    id: round_display
    spi_id: spi_bus
    cs_pin: GPIO9
    dc_pin: GPIO8
    reset_pin: GPIO14
    rotation: 0
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never

output:
  - platform: ledc
    pin: GPIO2
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: display_backlight
    restore_mode: RESTORE_DEFAULT_ON

# Brightness control
number:
  - platform: template
    name: "Display Brightness"
    id: brightness_control
    min_value: 10
    max_value: 100
    step: 10
    initial_value: 40
    optimistic: true
    on_value:
      then:
        - light.turn_on:
            id: display_backlight
            brightness: !lambda return x / 100.0;
        - lvgl.label.update:
            id: brightness_label
            text: !lambda |-
              static char buf[10];
              snprintf(buf, sizeof(buf), "%d%%", (int)x);
              return buf;

sensor:
  - platform: homeassistant
    id: print_progress
    entity_id: sensor.YOUR_PRINTER_ENTITY_print_progress
    on_value:
      then:
        # Update all three arc values
        - lvgl.arc.update:
            id: progress_arc_white
            value: !lambda return x;
        - lvgl.arc.update:
            id: progress_arc_green
            value: !lambda return x;
        - lvgl.arc.update:
            id: progress_arc_blue
            value: !lambda return x;
        # Show/hide appropriate arc based on progress and bed temp
        - if:
            condition:
              lambda: return x >= 100;
            then:
              # 100% complete - hide white, check bed temp for green vs blue
              - lvgl.widget.hide: progress_arc_white
              - if:
                  condition:
                    lambda: return id(bed_temp).state < 46;
                  then:
                    # Cooled - show blue
                    - lvgl.widget.hide: progress_arc_green
                    - lvgl.widget.show: progress_arc_blue
                  else:
                    # Still hot - show green
                    - lvgl.widget.hide: progress_arc_blue
                    - lvgl.widget.show: progress_arc_green
            else:
              # Printing - show white
              - lvgl.widget.show: progress_arc_white
              - lvgl.widget.hide: progress_arc_green
              - lvgl.widget.hide: progress_arc_blue
        - lvgl.label.update:
            id: progress_label
            text: !lambda |-
              static char buf[10];
              snprintf(buf, sizeof(buf), "%.0f%%", x);
              return buf;
            
  - platform: homeassistant
    id: chamber_temp
    entity_id: sensor.YOUR_PRINTER_ENTITY_chamber_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: chamber_label
            text: !lambda |-
              static char buf[10];
              snprintf(buf, sizeof(buf), "%.0f°", x);
              return buf;
              
  - platform: homeassistant
    id: nozzle_temp
    entity_id: sensor.YOUR_PRINTER_ENTITY_nozzle_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: nozzle_label
            text: !lambda |-
              static char buf[10];
              snprintf(buf, sizeof(buf), "%.0f°", x);
              return buf;
              
  - platform: homeassistant
    id: bed_temp
    entity_id: sensor.YOUR_PRINTER_ENTITY_bed_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: bed_label
            text: !lambda |-
              static char buf[10];
              snprintf(buf, sizeof(buf), "%.0f°", x);
              return buf;
        # If at 100%, update arc color based on bed temp
        - if:
            condition:
              lambda: return id(print_progress).state >= 100;
            then:
              - if:
                  condition:
                    lambda: return x < 46;
                  then:
                    # Cooled - show blue
                    - lvgl.widget.hide: progress_arc_green
                    - lvgl.widget.show: progress_arc_blue
                  else:
                    # Still hot - show green
                    - lvgl.widget.hide: progress_arc_blue
                    - lvgl.widget.show: progress_arc_green
            
  - platform: homeassistant
    id: current_layer
    entity_id: sensor.YOUR_PRINTER_ENTITY_current_layer
    on_value:
      then:
        - lvgl.label.update:
            id: layer_label
            text: !lambda |-
              static char buf[20];
              snprintf(buf, sizeof(buf), "%d/%d", (int)x, (int)id(total_layers).state);
              return buf;
    
  - platform: homeassistant
    id: total_layers
    entity_id: sensor.YOUR_PRINTER_ENTITY_total_layer_count
    on_value:
      then:
        - lvgl.label.update:
            id: layer_label
            text: !lambda |-
              static char buf[20];
              snprintf(buf, sizeof(buf), "%d/%d", (int)id(current_layer).state, (int)x);
              return buf;
              
  - platform: homeassistant
    id: remaining_time
    entity_id: sensor.YOUR_PRINTER_ENTITY_remaining_time
    on_value:
      then:
        - logger.log:
            format: "Remaining time (hours): %.4f"
            args: ['x']
        - lvgl.label.update:
            id: time_label
            text: !lambda |-
              // Sensor sends hours as decimal, convert to minutes
              if (isnan(x) || x <= 0) {
                ESP_LOGD("remaining_time", "No time or invalid");
                return "--";
              }
              
              int total_minutes = (int)(x * 60);  // Convert hours to minutes
              ESP_LOGD("remaining_time", "Hours: %.4f, Minutes: %d", x, total_minutes);
              
              static char buf[30];
              if (total_minutes > 60) {
                int hours = total_minutes / 60;
                int mins = total_minutes % 60;
                snprintf(buf, sizeof(buf), "%dh %dm left", hours, mins);
              } else {
                snprintf(buf, sizeof(buf), "%dm left", total_minutes);
              }
              ESP_LOGD("remaining_time", "Displaying: %s", buf);
              return buf;
              
  - platform: homeassistant
    id: ams_humidity
    entity_id: sensor.YOUR_PRINTER_ENTITY_ams_1_humidity
    on_value:
      then:
        - lvgl.label.update:
            id: ams_humidity_label
            text: !lambda |-
              static char buf[10];
              snprintf(buf, sizeof(buf), "%.0f%%", x);
              return buf;
              
  - platform: homeassistant
    id: ams_temp
    entity_id: sensor.YOUR_PRINTER_ENTITY_ams_1_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: ams_temp_label
            text: !lambda |-
