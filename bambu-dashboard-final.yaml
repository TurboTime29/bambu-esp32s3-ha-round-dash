            } else {
              lv_obj_set_style_text_color(label, lv_color_hex(0xFFFFFF), LV_PART_MAIN);
            }
            
  - platform: homeassistant
    id: ams_tray_4_color
    entity_id: sensor.YOUR_PRINTER_ENTITY_ams_1_tray_4
    attribute: color
    on_value:
      then:
