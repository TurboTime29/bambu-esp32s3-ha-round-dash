  # AMS Tray colors - using attribute sensors
  - platform: homeassistant
    id: ams_tray_1_color
    entity_id: sensor.p2s_22e8aj592301504_ams_1_tray_1
    attribute: color
    on_value:
      then:
        - lambda: |-
            ESP_LOGD("ams_color", "Tray 1 color attribute: %s", x.c_str());
            std::string color_str = x;
            if (color_str.empty() || color_str == "unknown") {
              return;
            }
            if (color_str[0] == '#') {
              color_str = color_str.substr(1);
            }
            // Strip alpha channel if present (take only first 6 hex chars = RGB)
            if (color_str.length() > 6) {
              color_str = color_str.substr(0, 6);
            }
            unsigned long color_val = strtoul(color_str.c_str(), NULL, 16);
            
            // Extract RGB for brightness calculation
            int r = (color_val >> 16) & 0xFF;
            int g = (color_val >> 8) & 0xFF;
            int b = color_val & 0xFF;
            int brightness = (r + g + b) / 3;
            
            ESP_LOGD("ams_color", "Tray 1 Color: %s RGB: R=%d G=%d B=%d (0x%06X), Brightness=%d", 
                     x.c_str(), r, g, b, (unsigned int)color_val, brightness);
            
            // Use EXACT color from Home Assistant
            auto obj = id(ams_slot_1_box);
            lv_obj_set_style_bg_color(obj, lv_color_hex(color_val), LV_PART_MAIN);
            
            // Update text color based on brightness
            auto label = id(ams_slot_1_label);
            if (brightness > 200) {
              lv_obj_set_style_text_color(label, lv_color_hex(0x666666), LV_PART_MAIN);  // Gray
            } else {
              lv_obj_set_style_text_color(label, lv_color_hex(0xFFFFFF), LV_PART_MAIN);  // White
            }
            
  - platform: homeassistant
    id: ams_tray_2_color
    entity_id: sensor.p2s_22e8aj592301504_ams_1_tray_2
    attribute: color
    on_value:
      then:
        - lambda: |-
            std::string color_str = x;
            if (color_str.empty() || color_str == "unknown") return;
            if (color_str[0] == '#') color_str = color_str.substr(1);
            // Strip alpha channel
            if (color_str.length() > 6) color_str = color_str.substr(0, 6);
            unsigned long color_val = strtoul(color_str.c_str(), NULL, 16);
            
            int r = (color_val >> 16) & 0xFF;
